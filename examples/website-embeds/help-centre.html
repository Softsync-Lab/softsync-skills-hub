<!doctype html>
<!--
  Put your help centre on your website: four ways. The help centre shows the
  articles you marked as "shown to customers", with search. Team-only articles
  never appear.

  Replace https://app.softsync.ai with your app address and WORKSPACE_ID/LINK_ID with the help
  centre's public link (its Share dialog shows the one-line version).
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Help</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 48px auto; padding: 0 20px; color: #1c1917; line-height: 1.6 }
    section { margin: 56px 0; padding-top: 24px; border-top: 1px solid #e7e2da }
    h2 { margin: 0 0 4px } p.note { color: #57534e; margin: 0 0 16px }
    .button { display: inline-block; padding: 10px 18px; border-radius: 10px; background: #1c1917; color: #fff; text-decoration: none; border: 0; font: inherit; cursor: pointer }
    /* A slide-over panel for "Help" in the header (way 4). */
    #help-panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); background: #fff; box-shadow: -20px 0 60px rgba(0, 0, 0, .2); transform: translateX(105%); transition: transform .25s; z-index: 50; display: flex; flex-direction: column }
    #help-panel.open { transform: none }
    #help-panel header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #e7e2da }
    #help-panel iframe { flex: 1; border: 0; width: 100% }
  </style>
</head>
<body>

<!-- 1. One line (recommended): the whole help centre inside your page. -->
<section id="one-line">
  <h2>1. One line</h2>
  <script src="https://app.softsync.ai/embed.js" data-page="portal/WORKSPACE_ID/LINK_ID" data-title="Help centre" async></script>
</section>

<!-- 2. A plain frame, for builders that do not allow scripts. -->
<section id="plain-frame">
  <h2>2. A plain frame</h2>
  <iframe src="https://app.softsync.ai/portal/WORKSPACE_ID/LINK_ID?embed=1" title="Help centre" loading="lazy"
          style="width:100%;height:720px;border:0"></iframe>
</section>

<!-- 3. A link. Good for the footer, emails and app menus. -->
<section id="link">
  <h2>3. A link</h2>
  <a class="button" href="https://app.softsync.ai/portal/WORKSPACE_ID/LINK_ID">Visit the help centre</a>
</section>

<!-- 4. A Help button in your header that slides the help centre in over any page. -->
<section id="slide-over">
  <h2>4. A Help button on every page</h2>
  <button class="button" type="button" id="open-help">Help</button>
</section>
<aside id="help-panel" aria-label="Help centre" aria-hidden="true">
  <header><b>Help</b><button type="button" id="close-help" aria-label="Close help">✕</button></header>
  <iframe title="Help centre" data-src="https://app.softsync.ai/portal/WORKSPACE_ID/LINK_ID?embed=1"></iframe>
</aside>
<script>
  const panel = document.getElementById('help-panel');
  const frame = panel.querySelector('iframe');
  const toggle = (open) => {
    if (open && !frame.src) frame.src = frame.dataset.src; // load it the first time it opens
    panel.classList.toggle('open', open);
    panel.setAttribute('aria-hidden', String(!open));
  };
  document.getElementById('open-help').onclick = () => toggle(true);
  document.getElementById('close-help').onclick = () => toggle(false);
</script>

</body>
</html>
